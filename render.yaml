# Cap Immo Tanger — API backend (Render blueprint)
# النشر: Blueprint من هذا المستودع، أو زر "Deploy to Render".
# ملاحظة: الخطة المجانية بلا قرص دائم — قاعدة البيانات تُعاد بناؤها
# من الرابط الحي عند كل إقلاع (انظر src/boot.js).

services:
  - type: web
    name: capimmo-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://bofrahi12.github.io
      - key: AGENCY_PHONE
        value: "0693981822"
      - key: ADMIN_PHONE
        value: "0693981822"
      - key: AI_PROVIDER
        value: local
      - key: TOKEN_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
